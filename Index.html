b("p10","L3 Evaluasi","Sikap Gita di akhir cerita sesuai dengan kesadarannya karena ia...",["Menyalahkan hujan","Masih membuang sampah di selokan","Berhenti membuang sampah sembarangan","Pindah rumah"],2,"Setelah sadar, Gita selalu membuang sampah pada tempatnya."),

b("p11","L2 Simpulan","Tanpa matahari, bumi akan...",["Terang dan hangat","Gelap dan sangat dingin","Banyak hujan","Penuh tumbuhan"],1,"Kalimat terakhir menyebut bumi gelap dan sangat dingin."),
b("p11","L3 Evaluasi","Judul yang paling sesuai untuk teks ini adalah...",["Manfaat Matahari","Cara Membuat Makanan","Pakaian Basah","Bumi yang Dingin"],0,"Judul harus mewakili seluruh isi teks: manfaat matahari."),
b("p12","L1 Tersurat","Aroma apa yang tercium di pasar pagi itu?",["Sayur segar dan kue basah","Ikan asin dan kopi","Bunga melati","Asap sampah"],0,"Teks menyebut aroma sayur segar dan harum kue basah."),
b("p12","L2 Ungkapan","'Suaranya menggelegar seperti petir' artinya suara pedagang...",["Pelan","Sangat keras","Merdu","Serak"],1,"Petir bersuara sangat keras, jadi suara pedagang pun sangat keras."),
b("p12","L2 Ide pokok","Ide pokok teks adalah...",["Suasana pasar pagi yang ramai","Cara berdagang","Harga sayur","Pasar yang sepi"],0,"Teks menggambarkan keramaian pasar pagi."),
b("p12","L3 Evaluasi","Pernyataan yang TIDAK sesuai dengan teks adalah...",["Pembeli berdesakan","Lapak berwarna-warni","Pasar itu sepi dan sunyi","Pedagang menawarkan dagangan"],2,"Teks menyebut pasar ramai, bukan sepi."),
b("p13","L1 Tersurat","Menurut penulis, anak sebaiknya tidur sebelum pukul...",["Delapan","Sembilan","Sepuluh","Sebelas"],1,"Kalimat pertama: sebelum pukul sembilan malam."),

b("p13","L3 Evaluasi","Alasan yang paling kuat mendukung pendapat penulis adalah...",["Anak suka tidur","Tubuh anak tumbuh saat tidur","Kasur itu empuk","Malam itu gelap"],1,"Alasan ini berhubungan langsung dengan manfaat tidur bagi anak."),
b("p14","L1 Tersurat","Siapa yang mengajari Raka bermain bola?",["Guru","Ayah","Kakak","Pelatih"],1,"Raka menjawab: diajari Ayah."),
b("p14","L2 Simpulan","Simpulan dari wawancara tersebut adalah...",["Raka berlatih rajin untuk meraih cita-cita","Raka malas bermain","Raka ingin berhenti","Raka tidak punya hobi"],0,"Raka berlatih tiap sore karena ingin jadi pemain nasional."),
b("p14","L2 Ide pokok","Ide pokok wawancara tersebut adalah...",["Hobi dan cita-cita Raka","Cara menendang bola","Sejarah sepak bola","Aturan pertandingan"],0,"Pertanyaan dan jawaban membahas hobi dan harapan Raka."),
b("p14","L3 Evaluasi","Jawaban yang sesuai untuk pertanyaan 'Apa harapanmu?' adalah...",["Sejak kelas dua","Ingin menjadi pemain nasional","Bermain bola","Diajari Ayah"],1,"Harapan berarti cita-cita yang ingin dicapai."),
b("p15","L1 Denah","Tempat di sebelah timur Lapangan adalah...",["Pasar","Rumah Tika","Masjid","Taman"],1,"Timur ada di kanan. Kanan Lapangan adalah Rumah Tika."),
b("p15","L2 Hubungan","Tika ke SD Harapan dari rumahnya berjalan ke arah...",["Selatan","Barat","Utara","Timur"],2,"SD Harapan tepat di atas Rumah Tika, jadi ke utara."),
b("p15","L2 Hubungan","Tika ke Masjid dari rumahnya, arah yang benar adalah...",["Selatan lalu barat","Utara lalu timur","Barat lalu utara","Timur lalu selatan"],0,"Dari rumah ke selatan sampai Kantor Pos, lalu ke barat sampai Masjid."),
b("p15","L3 Evaluasi","Pernyataan yang BENAR sesuai denah adalah...",["Bank berada di utara Pasar","Taman berada di utara Lapangan","Kantor Pos berada di barat Masjid","Puskesmas berada di timur Taman"],1,"Taman ada di baris atas tepat di atas Lapangan.")
];
const LV="eeeeheeeeheeeehhheehehh";let i0=0;Q.forEach(q=>{if(q.s=="mat"&&!q.l)q.l=LV[i0++];if(q.s=="ind")q.l=q.t[1]=="1"?"e":q.t[1]=="2"?"h":"x"});
const DEN2={p15:["🏥 Puskesmas","🌳 Taman","🏫 SD Harapan","🛒 Pasar","⛲ Lapangan","🏠 Rumah Tika","🏦 Bank","🕌 Masjid","📮 Kantor Pos"]};
const DENAH=["🏫 Sekolah","🌳 Taman","🏥 Rumah Sakit","🏠 Rumah Adi","🛒 Pasar","🏠 Rumah Siti"];
const $=document.getElementById("app");
let S={pts:0,badges:new Set()},G=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let ac;function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function home(){G=null;$.innerHTML=`<h1>🚀 Petualangan TKA Kelas 4</h1><div class="bar card"><span>⭐ Poin: ${S.pts}</span><span>🏅 ${S.badges.size} lencana</span></div>
<div class="card"><h3>🔢 Matematika</h3><button onclick="menu('mat')">Pilih Mode</button></div>
<div class="card"><h3>📖 Bahasa Indonesia</h3><button class="alt" onclick="menu('ind')">Pilih Mode</button></div>
<div class="card">${[...S.badges].map(x=>`<span class="badge">${x}</span>`).join("")||"Kumpulkan lencana dengan menjawab benar!"}</div>`}
let D="*";const LN={"*":"🌈 Semua",e:"🟢 Mudah",h:"🟠 Sulit",x:"🔥 HOTS"};const pool=s=>Q.filter(q=>q.s==s&&(D=="*"||q.l==D));function setD(s,d){D=d;menu(s)}
function menu(s){const n=pool(s).length,ps=[10,25,50].map(k=>Math.min(k,n));
$.innerHTML=`<h1>${s=="mat"?"🔢 Matematika":"📖 Bahasa Indonesia"}</h1><div class="card"><h3>🎚️ Tingkat Kesulitan (${n} soal)</h3>${Object.keys(LN).map(k=>`<button class="${D==k?"":"alt"}" onclick="setD('${s}','${k}')">${LN[k]}${D==k?" ✔":""}</button>`).join("")}</div><div class="card"><h3>🗺️ Mode Petualangan</h3>10 soal acak, 3 nyawa ❤️❤️❤️<button onclick="start('${s}',10,true)">Mulai Petualangan</button></div>
<div class="card"><h3>📝 Mode Latihan TKA</h3>Pembahasan di akhir ujian${[...new Set(ps)].map(k=>`<button class="alt" onclick="start('${s}',${k},false)">Paket ${k} Soal${k==n?" (Penuh)":""}</button>`).join("")}</div><button style="background:#888" onclick="home()">⬅ Kembali</button>`}
function start(s,k,adv){let l=shuffle(pool(s)).slice(0,k);G={s,l,i:0,adv,hp:3,sc:0,ben:0,ans:[],lock:false};show()}
function show(){const q=G.l[G.i];let h=`<div class="bar card"><span>${G.adv?"❤️".repeat(G.hp)+"🖤".repeat(3-G.hp):"📝 Latihan"}</span><span>Soal ${G.i+1}/${G.l.length}</span><span>⭐ ${G.sc}</span></div><div class="card pop"><div class="lv">${q.t}</div>`;
if(q.p){h+=(q.p=="p7"||DEN2[q.p])?`<div class="pass"><b>Denah (Utara ⬆️)</b><div class="grid">${(DEN2[q.p]||DENAH).map(x=>`<div>${x}</div>`).join("")}</div></div>`:`<div class="pass">${P[q.p]}</div>`}
h+=`<h3>${q.q}</h3>`;q.ord=shuffle([0,1,2,3]);q.ord.forEach((o,j)=>h+=`<button class="opt" id="o${j}" onclick="pick(${j})">${"ABCD"[j]}. ${q.o[o]}</button>`);
$.innerHTML=h+`</div><div id="fb"></div>`;G.lock=false}
function pick(j){if(G.lock)return;const q=G.l[G.i],right=q.ord[j]==q.a,ci=q.ord.indexOf(q.a);G.ans.push({q,right});
if(G.adv){G.lock=true;document.getElementById("o"+j).classList.add(right?"ok":"no");document.getElementById("o"+ci).classList.add("ok");
if(right){G.sc+=10;S.pts+=10;beep(660,.2);if(G.sc==50)S.badges.add("🌟 Bintang 5")}else{G.hp--;beep(180,.4);document.querySelector(".card.pop").classList.add("shake")}
document.getElementById("fb").innerHTML=`<div class="card ex">${right?"🎉 Hebat!":"😅 Belum tepat."} ${q.e}</div><button onclick="next()">${G.hp<=0||G.i==G.l.length-1?"Lihat Hasil":"Lanjut ➡"}</button>`}
else{if(right){G.sc+=10;S.pts+=10}next()}}
function next(){G.i++;if((G.adv&&G.hp<=0)||G.i>=G.l.length)return end();show()}
function end(){const ok=G.ans.filter(a=>a.right).length,n=G.ans.length;if(ok==n&&n>=10)S.badges.add("🏆 Sempurna");if(ok>=1)S.badges.add("🌱 Pemula");
let h=`<h1>${G.adv&&G.hp<=0?"💔 Nyawa habis":"🎊 Selesai!"}</h1><div class="card" style="text-align:center"><div style="font-size:48px">${ok/n>=.8?"🥇":ok/n>=.5?"🥈":"🥉"}</div><h2>Benar ${ok} dari ${n}</h2>Skor: ⭐ ${G.sc}</div>`;
if(!G.adv)h+=G.ans.map((a,i)=>`<div class="card"><b>${i+1}. ${a.right?"✅":"❌"}</b> ${a.q.q}<div class="ex">Jawaban: ${a.q.o[a.q.a]}<br>${a.q.e}</div></div>`).join("");
$.innerHTML=h+`<button onclick="start('${G.s}',${G.l.length},${G.adv})">🔁 Main Lagi</button><button class="alt" onclick="home()">🏠 Beranda</button>`}
home();
</script></body></html>
